# CI de M6: chequeo de tipos, pruebas con reportes JUnit y análisis Semgrep con SARIF.
name: M6 Viajes (G12) - CI & SAST

on:
  push:
    branches:
      - m6/base-de-datos
    paths:
      - "backend/**"
      - "openapi.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - m6/base-de-datos
    paths:
      - "backend/**"
      - "openapi.yaml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: m6-g12-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad-y-tests:
    name: Tipos, unitarios e integración
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: m6user
          POSTGRES_PASSWORD: m6password
          POSTGRES_DB: m6_trips
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m6user -d m6_trips"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://m6user:m6password@localhost:5432/m6_trips?schema=public

      - name: Chequeo de tipos TypeScript
        run: npx tsc --noEmit

      - name: Tests unitarios (Vitest + reporte JUnit)
        run: npx vitest run --reporter=default --reporter=junit --outputFile=reports/unit-junit.xml

      - name: Tests de integración y E2E contra PostgreSQL 16 (reporte JUnit)
        run: npx vitest run --config vitest.integration.config.ts --reporter=default --reporter=junit --outputFile=reports/integration-junit.xml
        env:
          DATABASE_URL: postgresql://m6user:m6password@localhost:5432/m6_trips?schema=public
          TEST_DATABASE_URL: postgresql://m6user:m6password@localhost:5432/m6_trips_test?schema=public
          M8_API_URL: ""

      - name: Guardar reportes de tests como artefacto
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: g12-vitest-reports
          path: backend/reports/*.xml
          if-no-files-found: warn

  sast:
    name: Análisis estático SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Ejecutar Semgrep (OWASP Top 10, TypeScript, Node.js, Secrets)
        run: |
          mkdir -p reports
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep:1.184.0 \
            semgrep scan \
            --config p/typescript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --config p/secrets \
            --metrics=off \
            --sarif \
            --output /src/reports/semgrep-g12.sarif \
            /src/backend/src

      - name: Guardar reporte SARIF como artefacto
        uses: actions/upload-artifact@v6
        with:
          name: g12-semgrep-sarif
          path: reports/semgrep-g12.sarif
          if-no-files-found: error

      - name: Publicar SARIF en GitHub Security
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: reports/semgrep-g12.sarif
          category: semgrep-g12
