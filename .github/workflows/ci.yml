# CI de M6: chequeo de tipos, pruebas con reportes JUnit y análisis Semgrep con SARIF.
name: M6 Viajes (G12) - CI & SAST

on:
  push:
    branches:
      - m6/base-de-datos
    paths:
      - "backend/**"
      - "frontend/**"
      - "openapi.yaml"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - m6/base-de-datos
  workflow_dispatch:

concurrency:
  group: m6-g12-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad-y-tests:
    name: Tipos, unitarios e integración
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: m6user
          POSTGRES_PASSWORD: m6password
          POSTGRES_DB: m6_trips
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m6user -d m6_trips"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://m6user:m6password@localhost:5432/m6_trips?schema=public

      - name: Chequeo de tipos TypeScript
        run: npx tsc --noEmit

      - name: Tests unitarios (Vitest + reporte JUnit)
        run: npx vitest run --reporter=default --reporter=junit --outputFile=reports/unit-junit.xml

      - name: Tests de integración y E2E contra PostgreSQL 16 (reporte JUnit)
        run: npx vitest run --config vitest.integration.config.ts --reporter=default --reporter=junit --outputFile=reports/integration-junit.xml
        env:
          DATABASE_URL: postgresql://m6user:m6password@localhost:5432/m6_trips?schema=public
          TEST_DATABASE_URL: postgresql://m6user:m6password@localhost:5432/m6_trips_test?schema=public
          M8_API_URL: ""

      - name: Guardar reportes de tests como artefacto
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: g12-vitest-reports
          path: backend/reports/*.xml
          if-no-files-found: warn

  imagen:
    name: Imagen Docker (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [calidad-y-tests, sast]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Construir la imagen
        run: |
          VERSION=$(node -p "require('./backend/package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker build -f backend/Dockerfile -t m6-viajes-g12:ci .

      - name: Probar arranque con PostgreSQL
        run: |
          set -euo pipefail
          RED="m6-ci-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "${RED}-api" "${RED}-db" >/dev/null 2>&1 || true
            docker network rm "$RED" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$RED"
          docker run -d --name "${RED}-db" --network "$RED" \
            -e POSTGRES_USER=m6user \
            -e POSTGRES_PASSWORD=m6password \
            -e POSTGRES_DB=m6_trips \
            postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec "${RED}-db" pg_isready -U m6user -d m6_trips >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "${RED}-db" pg_isready -U m6user -d m6_trips
          docker run -d --name "${RED}-api" --network "$RED" -p 3006:3006 \
            -e DATABASE_URL="postgresql://m6user:m6password@${RED}-db:5432/m6_trips?schema=public" \
            -e ENABLE_DEMO_AUTH=true \
            m6-viajes-g12:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3006/health/details >/dev/null 2>&1; then
              echo "health/details respondio 200"
              exit 0
            fi
            sleep 1
          done
          echo "La imagen no respondio /health/details en 60 s"
          docker logs "${RED}-api"
          exit 1

      # Publica solo desde la rama base: los PR construyen la imagen pero no la suben.
      - name: Publicar en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/m6/base-de-datos'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGEN="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/m6-viajes-g12"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for TAG in "$VERSION" "sha-${GITHUB_SHA::7}" latest; do
            docker tag m6-viajes-g12:ci "$IMAGEN:$TAG"
            docker push "$IMAGEN:$TAG"
          done

  sast:
    name: Análisis estático SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 22 para evaluar SARIF
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Probar el criterio de severidad
        run: node --test backend/scripts/semgrep-quality-gate.test.mjs

      - name: Ejecutar Semgrep (OWASP Top 10, TypeScript, Node.js, Secrets)
        run: |
          mkdir -p reports
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep:1.184.0 \
            semgrep scan \
            --config p/typescript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --config p/secrets \
            --metrics=off \
            --sarif \
            --output /src/reports/semgrep-g12.sarif \
            /src/backend/src

      - name: Guardar reporte SARIF como artefacto
        uses: actions/upload-artifact@v6
        with:
          name: g12-semgrep-sarif
          path: reports/semgrep-g12.sarif
          if-no-files-found: error

      - name: Publicar SARIF en GitHub Security
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: reports/semgrep-g12.sarif
          category: semgrep-g12

      - name: Evaluar Quality Gate de Semgrep
        run: node backend/scripts/semgrep-quality-gate.mjs reports/semgrep-g12.sarif
