# CI de M6: chequeo de tipos, pruebas con reportes JUnit y análisis Semgrep con SARIF.
name: M6 (G12) - Demostración aislada del umbral Semgrep

on:
  workflow_dispatch:
    inputs:
      level:
        description: Nivel SARIF sintético
        required: true
        type: choice
        options:
          - warning
          - error

concurrency:
  group: m6-g12-demo-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad-y-tests:
    if: ${{ false }}
    name: Tipos, unitarios e integración
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: m6user
          POSTGRES_PASSWORD: m6password
          POSTGRES_DB: m6_trips
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m6user -d m6_trips"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://m6user:m6password@localhost:5432/m6_trips?schema=public

      - name: Chequeo de tipos TypeScript
        run: npx tsc --noEmit

      - name: Tests unitarios (Vitest + reporte JUnit)
        run: npx vitest run --reporter=default --reporter=junit --outputFile=reports/unit-junit.xml

      - name: Tests de integración y E2E contra PostgreSQL 16 (reporte JUnit)
        run: npx vitest run --config vitest.integration.config.ts --reporter=default --reporter=junit --outputFile=reports/integration-junit.xml
        env:
          DATABASE_URL: postgresql://m6user:m6password@localhost:5432/m6_trips?schema=public
          TEST_DATABASE_URL: postgresql://m6user:m6password@localhost:5432/m6_trips_test?schema=public
          M8_API_URL: ""

      - name: Guardar reportes de tests como artefacto
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: g12-vitest-reports
          path: backend/reports/*.xml
          if-no-files-found: warn

  sast:
    name: Análisis estático SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 22 para evaluar SARIF
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Probar el criterio de severidad
        run: node --test backend/scripts/semgrep-quality-gate.test.mjs

      - name: Generar un SARIF sintético para la demostración
        env:
          DEMO_SARIF_LEVEL: ${{ inputs.level }}
        run: |
          mkdir -p reports
          node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const level = process.env.DEMO_SARIF_LEVEL;
          if (!["warning", "error"].includes(level)) throw new Error("Nivel de demo inválido");
          const ruleId = "demo-m6";
          const sarif = {
            version: "2.1.0",
            runs: [{
              tool: { driver: { name: "Fixture de G12", rules: [{ id: ruleId }] } },
              results: [{ ruleId, level, message: { text: "Hallazgo sintético de demostración" } }],
            }],
          };
          writeFileSync("reports/semgrep-g12.sarif", JSON.stringify(sarif));
          NODE

      - name: Guardar reporte SARIF como artefacto
        uses: actions/upload-artifact@v6
        with:
          name: g12-semgrep-sarif
          path: reports/semgrep-g12.sarif
          if-no-files-found: error

      - name: Evaluar Quality Gate de Semgrep
        run: node backend/scripts/semgrep-quality-gate.mjs reports/semgrep-g12.sarif
