openapi: 3.1.0
info:
  title: Módulo M6 - Viajes y Ciclo de Vida API
  description: |
    API REST para la gestión de la máquina de estados del viaje, validación de inicio, 
    cierre, cancelaciones y auditoría de transiciones (Grupo 12 - Desarrollo de Software 2026).

    **Catálogo de eventos (RNF-03):** los eventos asíncronos emitidos por M6 se documentan como
    esquemas en `components/schemas` (`TripCreatedEvent`, `DriverArrivedEvent`, `TripStartedEvent`,
    `TripCompletedEvent`, `TripCancelledByClientEvent`, `TripCancelledByDriverEvent`), todos basados
    en `EventEnvelope`.
  version: 1.0.0

servers:

    description: Servidor de desarrollo local (Contenedor OCI)

security:
  - bearerAuth: []

tags:
  - name: Trips
    description: Operaciones del ciclo de vida y consultas de viajes
  - name: Health
    description: Diagnóstico y salud del servicio (RNF-14)

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check del servicio (RNF-14)
      security: []
      responses:
        '200':
          description: El servicio y la base de datos responden correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  timestamp:
                    type: string
                    format: date-time

  /trips:
    post:
      tags: [Trips]
      summary: Crear un nuevo viaje tras asignación en despacho (Desde M5)
      description: |
        Inicia el ciclo de vida del viaje en estado `PENDING_ARRIVAL`.
        Rol requerido: `SYSTEM` o `roles: ["SERVICIO"]` (token de servicio de M5 emitido por M1).
        Es idempotente respecto a `requestId`: si el mismo `requestId` llega más de una vez
        con los mismos datos, no se crea otro viaje y se devuelve el ya existente (RNF-08 / RNF-09).
        Emite evento `TripCreated` hacia M8 y M4 (solo en la creación inicial).
        El `requestId` identifica el **intento de asignación**, no la solicitud de M5: si un viaje
        se cancela y M5 vuelve a despachar, debe enviar un `requestId` nuevo. El viaje cancelado
        se conserva en el historial y no se reutiliza.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Viaje creado exitosamente (por primera vez) en estado PENDING_ARRIVAL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '200':
          description: Ya existía un viaje para ese `requestId`; se devuelve el mismo viaje sin crear otro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: | 
            `requestId` ya existe con datos de creación distintos (código `REQUEST_ID_CONFLICT`).
            El conflicto se decide comparando todos los campos de creación: clientId, driverId,
            vehicleId, vehicleType, reservationId, coordenadas y direcciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Trips]
      summary: Listar viajes filtrados (Para historial de M2 o consultas de Operador)
      description: |
        Permite a M2 obtener el historial resumido de un cliente (RF-2.4) o filtrar por conductor/estado.
        Devuelve `TripSummary` (sin coordenadas, RF-4.7 / RNF-19), paginado y ordenado por `createdAt` descendente.
        Roles permitidos:
        - `CLIENT` / `CLIENTE`: devuelve únicamente viajes de su propio `clientId`.
        - `DRIVER` / `CONDUCTOR`: devuelve únicamente viajes de su propio `driverId`.
        - `SYSTEM` / `SERVICIO` (ej. M2): **requiere obligatoriamente al menos un filtro** (`clientId`, `driverId` o `state`);
          una llamada sin filtros devuelve `400 Bad Request` (`code: "FILTER_REQUIRED"`) para evitar exponer viajes de todos los usuarios.
        - `OPERATOR` / `OPERADOR`: acceso administrativo de consulta.
      parameters:
        - in: query
          name: clientId
          schema:
            type: string
            format: uuid
          description: Filtrar por ID del cliente (obligatorio para consultas de historial desde M2 con rol SYSTEM/SERVICIO)
        - in: query
          name: driverId
          schema:
            type: string
            format: uuid
          description: Filtrar por ID del conductor
        - in: query
          name: state
          schema:
            $ref: '#/components/schemas/TripState'
          description: Filtrar por estado actual del viaje
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Número de página (base 1)
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Cantidad de elementos por página
      responses:
        '200':
          description: Página de viajes resumidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /trips/{id}:
    get:
      tags: [Trips]
      summary: Consultar estado actual y resumen de un viaje (RF-6.2)
      description: |
        Accesible por el cliente del viaje (`CLIENT`), el conductor asignado (`DRIVER`), un operador (`OPERATOR`)
        o un módulo de servicio (`SYSTEM` / `roles: ["SERVICIO"]`, por ejemplo M2 al verificar que el viaje esté
        `COMPLETED`, pertenezca al `clientId` y obtener el `driverId` para calificar al conductor).
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      responses:
        '200':
          description: Detalle y estado actual del viaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /trips/{id}/arrived:
    post:
      tags: [Trips]
      summary: Indicar arribo del conductor al punto de retiro (RF-6.3)
      description: |
        Transición: `PENDING_ARRIVAL` -> `DRIVER_ARRIVED`.
        Rol requerido: `DRIVER` (debe coincidir con el `driverId` asignado).
        Emite evento asíncrono `DriverArrived` hacia M8.
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      responses:
        '200':
          description: Arribo registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transición inválida (el viaje no está en estado PENDING_ARRIVAL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips/{id}/start:
    post:
      tags: [Trips]
      summary: Iniciar viaje validando código QR / token de un solo uso (RF-6.4)
      description: |
        Transición: `DRIVER_ARRIVED` -> `IN_PROGRESS`.
        Rol requerido: `DRIVER`.
        Valida el token contra M8 antes de aplicar la transición. Emite evento `TripStarted` hacia M8.
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTripRequest'
      responses:
        '200':
          description: QR validado e inicio de viaje registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transición inválida (el viaje no está en estado DRIVER_ARRIVED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: El código QR / token de verificación es inválido, ya fue usado o expiró
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Servicio de validación (M8) no disponible o timeout excedido (RNF-13)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips/{id}/complete:
    post:
      tags: [Trips]
      summary: Finalizar el viaje registrando métricas de tiempo y distancia (RF-6.5)
      description: |
        Transición: `IN_PROGRESS` -> `COMPLETED`.
        Rol requerido: `DRIVER`. Protegido contra doble finalización concurrente (RNF-08).
        Emite evento `TripCompleted` hacia M7, M8, M4, M2 y M3.
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTripRequest'
      responses:
        '200':
          description: Viaje finalizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transición inválida o intento de doble finalización (el viaje no está en IN_PROGRESS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips/{id}/cancel:
    post:
      tags: [Trips]
      summary: Cancelar un viaje por parte del cliente o conductor (RF-6.6 y RF-6.7)
      description: |
        Transición desde `PENDING_ARRIVAL` o `DRIVER_ARRIVED` hacia:
        - `CANCELLED_BY_CLIENT` si el rol en el JWT es `CLIENT` (emite `TripCancelledByClient` a M7, M8 y M4).
        - `CANCELLED_BY_DRIVER` si el rol en el JWT es `DRIVER` (emite `TripCancelledByDriver` a M5, M8 y M4).
        No se permite cancelar un viaje en estado `IN_PROGRESS` ni en un estado terminal;
        los incidentes durante el viaje los gestiona el operador (alcance TP2).
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTripRequest'
      responses:
        '200':
          description: Viaje cancelado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El viaje ya no puede ser cancelado en su estado actual (ej. IN_PROGRESS o ya finalizado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips/{id}/history:
    get:
      tags: [Trips]
      summary: Consultar el historial inmutable de transiciones del viaje (RF-6.8)
      description: Devuelve la trazabilidad completa de auditoría (estados, actores, fechas y motivos).
      parameters:
        - $ref: '#/components/parameters/TripIdParam'
      responses:
        '200':
          description: Lista cronológica de eventos del viaje
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripEventHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT emitido por M1 (Identidad y Acceso) con claim `sub` (o `identidad_id`) e información de rol.
        Soporta tanto `role` string (`CLIENT`, `DRIVER`, `OPERATOR`, `SYSTEM`) como `roles` array
        (`["CLIENTE"]`, `["CONDUCTOR"]`, `["OPERADOR"]`, `["SERVICIO"]`). El rol `SYSTEM` / `SERVICIO`
        corresponde a tokens de servicio usados en la comunicación entre módulos (ej. M2 → M6 o M5 → M6, RF-1.4).

  parameters:
    TripIdParam:
      name: id
      in: path
      required: true
      description: Identificador único del viaje (UUID)
      schema:
        type: string
        format: uuid

  schemas:
    TripState:
      type: string
      enum:
        - PENDING_ARRIVAL
        - DRIVER_ARRIVED
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED_BY_CLIENT
        - CANCELLED_BY_DRIVER

    CreateTripRequest:
      type: object
      required:
        - requestId
        - clientId
        - driverId
        - vehicleId
        - vehicleType
        - originLatitude
        - originLongitude
        - destinationLatitude
        - destinationLongitude
      properties:
        requestId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        clientId:
          type: string
          format: uuid
          example: "a3e4d8c2-75b1-4f92-8b12-456789abcdef"
        driverId:
          type: string
          format: uuid
          example: "b4f5e9d3-86c2-4a13-9c23-567890abcdef"
        vehicleId:
          type: string
          format: uuid
          example: "c5a6f0e4-97d3-4b24-8d34-678901abcdef"
        vehicleType:
          type: string
          enum: [CAR, MOTORCYCLE]
          description: Tipo de vehículo asignado. M7 lo necesita para calcular la tarifa.
          example: CAR
        reservationId:
          type: [string, "null"]
          format: uuid
          description: Reserva de origen (M9), o null si el viaje no viene de una reserva.
        originAddress:
          type: [string, "null"]
          maxLength: 300
          description: Dirección legible del origen, para mostrarla en el historial.
          example: "Av. Corrientes 1000"
        destinationAddress:
          type: [string, "null"]
          maxLength: 300
          description: Dirección legible del destino, para mostrarla en el historial.
          example: "Av. Santa Fe 3000"
        originLatitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: -27.4512
        originLongitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -58.8289
        destinationLatitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: -27.4500
        destinationLongitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -58.8000

    StartTripRequest:
      type: object
      required:
        - verificationToken
      properties:
        verificationToken:
          type: string
          description: Código QR o token efímero de un solo uso generado por M8
          example: "qr_tok_98f7d6a5s4d3"

    CompleteTripRequest:
      type: object
      required:
        - distanceKm
        - durationMinutes
      properties:
        distanceKm:
          type: number
          format: float
          minimum: 0.1
          example: 6.4
        durationMinutes:
          type: integer
          minimum: 1
          example: 18

    CancelTripRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 255
          example: "Demora excesiva del conductor / Imprevisto personal"

    Trip:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        originLatitude:
          type: number
          format: double
        originLongitude:
          type: number
          format: double
        destinationLatitude:
          type: number
          format: double
        destinationLongitude:
          type: number
          format: double
        state:
          $ref: '#/components/schemas/TripState'
        distanceKm:
          type: [number, "null"]
          format: float
        durationMinutes:
          type: [integer, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TripEventHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/TripState'
        actorId:
          type: [string, "null"]
          format: uuid
          description: Identificador de quien hizo el cambio. Queda vacío cuando `actorRole` es `SYSTEM`.
          example: "b4f5e9d3-86c2-4a13-9c23-567890abcdef"
        actorRole:
          type: string
          enum: [CLIENT, DRIVER, OPERATOR, SYSTEM]
        reason:
          type: [string, "null"]
        metadata:
          type: [object, "null"]
          additionalProperties: true
          example: { "distanceKm": 6.4, "durationMinutes": 18 }
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          example: "INVALID_STATE_TRANSITION"
        message:
          type: string
          example: "No se puede pasar a IN_PROGRESS desde el estado PENDING_ARRIVAL"
        correlationId:
          type: string
          description: ID de correlación para trazabilidad en logs (RNF-14)
        timestamp:
          type: string
          format: date-time

    TripSummary:
      type: object
      description: Vista resumida de un viaje para historiales (sin coordenadas, RF-2.4 / RF-4.7)
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/TripState'
        clientId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        distanceKm:
          type: [number, "null"]
          format: float
        durationMinutes:
          type: [integer, "null"]
        createdAt:
          type: string
          format: date-time

    TripSummaryPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TripSummary'
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          description: Cantidad total de viajes que cumplen el filtro
          example: 42

    # ------------------------------------------------------------------
    # Catálogo de eventos asíncronos emitidos por M6 (RNF-03 / RNF-10)
    # ------------------------------------------------------------------
    EventEnvelope:
      type: object
      description: Sobre común de todos los eventos de dominio publicados por M6.
      required: [eventId, eventType, eventVersion, occurredAt, tripId]
      properties:
        eventId:
          type: string
          format: uuid
          description: Identificador único del evento; los consumidores deduplican por este valor (RNF-09)
        eventType:
          type: string
          enum:
            - TripCreated
            - DriverArrived
            - TripStarted
            - TripCompleted
            - TripCancelledByClient
            - TripCancelledByDriver
        eventVersion:
          type: integer
          minimum: 1
          example: 1
        occurredAt:
          type: string
          format: date-time
        tripId:
          type: string
          format: uuid
        correlationId:
          type: string
          description: ID de correlación propagado desde la petición original (RNF-14)

    TripCreatedPayload:
      type: object
      required: [requestId, clientId, driverId, vehicleId]
      properties:
        requestId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid

    TripStatusPayload:
      type: object
      description: Datos mínimos para notificar a las partes del viaje.
      required: [clientId, driverId]
      properties:
        clientId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid

    TripCompletedPayload:
      type: object
      required: [clientId, driverId, vehicleId, distanceKm, durationMinutes]
      properties:
        clientId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        distanceKm:
          type: number
          format: float
          example: 6.4
        durationMinutes:
          type: integer
          example: 18

    TripCancelledPayload:
      type: object
      required: [requestId, clientId, driverId, cancelledBy, reason, previousState, secondsSinceCreation]
      properties:
        requestId:
          type: string
          format: uuid
          description: Solicitud original de M5 (permite a M5 re-despachar)
        clientId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        cancelledBy:
          type: string
          enum: [CLIENT, DRIVER]
        reason:
          type: string
        previousState:
          $ref: '#/components/schemas/TripState'
        secondsSinceCreation:
          type: integer
          minimum: 0
          description: Tiempo transcurrido desde la creación del viaje, para el cálculo del cargo de cancelación en M7 (RF-7.4)

    TripCreatedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [payload]
          properties:
            eventType:
              type: string
              enum: [TripCreated]
            payload:
              $ref: '#/components/schemas/TripCreatedPayload'

    DriverArrivedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [payload]
          properties:
            eventType:
              type: string
              enum: [DriverArrived]
            payload:
              $ref: '#/components/schemas/TripStatusPayload'

    TripStartedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [payload]
          properties:
            eventType:
              type: string
              enum: [TripStarted]
            payload:
              $ref: '#/components/schemas/TripStatusPayload'

    TripCompletedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [payload]
          properties:
            eventType:
              type: string
              enum: [TripCompleted]
            payload:
              $ref: '#/components/schemas/TripCompletedPayload'

    TripCancelledByClientEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [payload]
          properties:
            eventType:
              type: string
              enum: [TripCancelledByClient]
            payload:
              $ref: '#/components/schemas/TripCancelledPayload'

    TripCancelledByDriverEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [payload]
          properties:
            eventType:
              type: string
              enum: [TripCancelledByDriver]
            payload:
              $ref: '#/components/schemas/TripCancelledPayload'

  responses:
    BadRequest:
      description: Datos de entrada inválidos o faltantes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token JWT ausente, inválido o expirado (M1)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
