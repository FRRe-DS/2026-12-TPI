services:
  db:
    image: postgres:16
    container_name: m6-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - m6_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Keycloak de M6: hace de M1 (identidad) para el modulo (RNF-12).
  # Su realm se deriva del de la catedra y suma los roles de usuario y
  # usuarios de desarrollo que ese realm no trae (ver keycloak/README.md).
  keycloak-db:
    image: postgres:16
    container_name: m6-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev}
    volumes:
      - m6_keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    container_name: m6-keycloak
    restart: unless-stopped
    command: start --import-realm
    environment:
      # El emisor (iss) de los tokens queda fijado en este host y puerto.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: ${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-ds2026}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/realm-config:/opt/keycloak/data/import
    depends_on:
      keycloak-db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: m6-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: "3006"
      # Los atajos de demo quedan apagados por defecto (RNF-12). Para usarlos en una
      # demostracion local: ENABLE_DEMO_AUTH=true en el .env de la raiz.
      ENABLE_DEMO_AUTH: ${ENABLE_DEMO_AUTH:-false}
      # El emisor es el host publicado de Keycloak; las claves se bajan por la red interna.
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8081/realms/ds-2026-realm}
      AUTH_JWKS_URI: ${AUTH_JWKS_URI:-http://keycloak:8080/realms/ds-2026-realm/protocol/openid-connect/certs}
      AUTH_JWKS_TIMEOUT_MS: ${AUTH_JWKS_TIMEOUT_MS:-3000}
    ports:
      - "3006:3006"

volumes:
  m6_pgdata:
    driver: local
  m6_keycloak_pgdata:
    driver: local
